# The Playwright browser journey (desktop and mobile), ON DEMAND ONLY — never per merge, never
# on a schedule.
#
# BUILD FIRST, TEST IN BATCHES. This suite runs only when dispatched by a person
# (`gh workflow run e2e.yml --ref main`), by `land --promote founder-dilution-dashboard --run-e2e`,
# or by `land` after a large change (the `land` PR in seq23/seq-bin defines "large"); the merge
# gate is `validate.yml` (unit, build, guards), and `land <pr>` deploys STAGING (`main`) on every
# merge. After a LARGE change production moves only to a commit this workflow has passed on: a
# successful dispatch on main triggers `promote.yml`, which fast-forwards the `production` branch
# to this exact sha — what Cloudflare Pages serves at dilution.joinwestpeek.com. A SMALL change
# ships on the fast check without this journey (owner decision 2 Oct 2026; `land <pr>` dispatches
# `promote.yml` with its verdict, `scripts/production-gate.mjs` checks it). A red run here leaves
# production where it is, BLOCKS every small change until a green run is newer (known red), and is
# fixed first (bisect between the last green sha and this one). `timeout-minutes` is a fault
# detector (~4x normal), never a budget.
#
# Owner decision 2 Oct 2026: on demand only; supersedes the 26 Sep nightly cron.
# NOT `schedule`, NOT `push`, NOT `pull_request`: scripts/validate-workflows.mjs fails the merge
# gate if any of them comes back — the only trigger is `workflow_dispatch`.
name: e2e

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Normal: ~1 min including the Chromium install. 10 is a fault detector, never a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static build
        run: npm run build
      # Same code path as a laptop: scripts/e2e.mjs builds .venv/ from requirements-e2e.txt and
      # installs Chromium. E2E_INSTALL_DEPS=1 adds --with-deps so the runner gets Chromium's
      # OS libraries too. No separate pip step, so CI and local can never drift on the pin.
      - name: Browser journey (Playwright E2E)
        run: npm run test:e2e
        env:
          E2E_INSTALL_DEPS: "1"
