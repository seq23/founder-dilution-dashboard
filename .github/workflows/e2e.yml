# The Playwright browser journey (desktop and mobile), nightly and on demand — never per merge.
#
# Build first, test in batches (26 Sep 2026). The merge gate is `validate.yml` (unit, build,
# guards). This suite runs on main's head once a night and whenever dispatched; on success
# `promote.yml` fast-forwards the `production` branch to this exact sha, which is what Cloudflare
# Pages serves at dilution.joinwestpeek.com. A red nightly leaves production where it is and is
# fixed first (bisect between the last green sha and this one). `timeout-minutes` is a fault
# detector (~4x normal), never a budget.
#
# NOT `push`, NOT `pull_request`: scripts/validate-workflows.mjs fails the merge gate if either
# trigger comes back.
name: e2e

on:
  schedule:
    - cron: "20 7 * * *" # nightly 07:20 UTC (02:20 CT), main's head
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Normal: ~1 min including the Chromium install. 10 is a fault detector, never a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static build
        run: npm run build
      # Same code path as a laptop: scripts/e2e.mjs builds .venv/ from requirements-e2e.txt and
      # installs Chromium. E2E_INSTALL_DEPS=1 adds --with-deps so the runner gets Chromium's
      # OS libraries too. No separate pip step, so CI and local can never drift on the pin.
      - name: Browser journey (Playwright E2E)
        run: npm run test:e2e
        env:
          E2E_INSTALL_DEPS: "1"
