name: validate

# The MERGE GATE for founder-dilution-dashboard: unit tests, the static build, the runbook and
# workflow guards — under two minutes. It is the run ~/bin/land watches on `main`.
#
# Build first, test in batches (26 Sep 2026): the Playwright browser journey is NOT here. It runs
# on demand only (`workflow_dispatch` in `e2e.yml`, no cron — owner decision 2 Oct 2026):
# Cloudflare Pages builds every push to `main` as the staging preview
# (https://main.founder-dilution-dashboard.pages.dev) and builds the `production` branch to
# dilution.joinwestpeek.com; `promote.yml` moves that branch.
#
# THIS RUN IS WHAT A SMALL CHANGE SHIPS ON (owner decision 2 Oct 2026): `land <pr>` sends a small
# change to production once this run is green on the merge commit; the journey gates production
# only after a large change (land defines "large", in seq23/seq-bin) or when asked. The rule is
# `scripts/production-gate.mjs`; its self-test runs below. `scripts/validate-workflows.mjs` fails
# this run if the journey ever comes back on push, pull_request or a schedule, or if promote.yml
# stops going through the gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Normal: ~1 min (runs 35920287012, 35878588760 took 59 s and 54 s WITH the browser journey).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests, money math and UI copy
        run: npm run test:unit
      - name: Static build
        run: npm run build
      - name: Runbook names real paths and scripts
        run: npm run validate:runbook
      - name: The browser journey is on demand only, never per merge or on a schedule; production moves only by promote, through the production gate
        run: npm run validate:workflows
      - name: The production gate decides every case correctly, and five broken gates are caught
        run: npm run validate:gate
